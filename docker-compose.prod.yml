version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "8070:8080"
    volumes:
      - ./backend/data:/root/data:ro
    environment:
      - PORT=8080
      - ENV=production
    restart: unless-stopped
    networks:
      - lms-ziad-quiz-network
    healthcheck:
      test: ["CMD", "true"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "9070:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lms-ziad-quiz-network
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost:80
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:

networks:
  lms-ziad-quiz-network:
    driver: bridge
