# development
version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8069:8080"
    volumes:
      - ./backend:/app
    environment:
      - PORT=8080
      - ENV=development
    networks:
      - lms-ziad-quiz-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "5169:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    command: bun run dev -- --host
    depends_on:
      - backend
    networks:
      - lms-ziad-quiz-network

networks:
  lms-ziad-quiz-network:
    driver: bridge
